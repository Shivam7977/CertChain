<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="style.css"><title>Sign up - CertChain</title><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script><script src="contract.js"></script><script src="firebase-config.js"></script></head><body>
<header id="top"></header>
<main class="auth"><div class="box"><h1>Create account</h1><p class="sub">Sign up as a verifier to check certificates</p>
<form id="f"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
<label for="pw">Password (at least 6 characters)</label><input id="pw" type="password" autocomplete="new-password" minlength="6" required>
<label for="pw2">Confirm password</label><input id="pw2" type="password" autocomplete="new-password" required>
<button id="go">Create account</button></form><div id="msg"></div>
<p class="small" style="margin-top:18px">Already have an account? <a href="login.html">Log in</a></p></div></main>
<script src="shared.js"></script>
<script>
renderNav("verify.html");
const $ = (id) => document.getElementById(id);
const say = (c, t) => { $("msg").className = "msg " + c; $("msg").textContent = t; };
const auth = authInit(say);
if (auth) {
  auth.onAuthStateChanged((u) => { if (u) location.replace(nextUrl()); });
  $("f").onsubmit = (ev) => {
    ev.preventDefault();
    if ($("pw").value !== $("pw2").value) return say("bad", "Passwords do not match.");
    auth.createUserWithEmailAndPassword($("email").value.trim(), $("pw").value).catch((e) => say("bad", authErr(e)));
  };
} else $("go").disabled = true;
</script></body></html>
